# mantis bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 mantis，不外接、不 link 其它红队包。

# 本体 insert 放在 bundle 层：dsh plugin add 会把本包写进 dsh.profile.bundles，
# bundle 的 patch 文件随之加载，这里就是唯一入口。
# 不要再往用户层 profile/cordis.patch.yml 补第二份 —— 同一个 id 入队两次会 already queued
# （#152 / #154 / #159）。
- insert:
    - id: mantis
      name: '@zhuifengqug/dsh-mantis'
      inject: [systemPrompt, tools]

    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: mantis-redteam
      name: '@zhuifengqug/dsh-mantis/redteam'

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: mantis-redteam-store
      name: '@zhuifengqug/dsh-mantis/redteam/store'
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: mantis-redteam-ui
      name: '@zhuifengqug/dsh-mantis/redteam/ui'

# 本体配置：insert 之后再覆盖，顺序不能颠倒（applyEntryPatches 先 insert 才 buildMap）
- id: mantis
  name: '@zhuifengqug/dsh-mantis'
  config:
    enabled: true
    autoApplyOnStart: false
    autoUpdateOnStart: false
    autoRevertOnMissing: false
    injectOnce: false
    stripMnemon: true
    verbose: false
    postPrompt: ""
    postPromptOrder: 5100
    autoRetry: true
    retryMax: 3
    autoContinue: false
    continueMax: 3
    continueText: "继续"
    capabilityProtocol: true
    hooksDenyBypass: true
    anchorMode: auto
    subagentControl: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: ""

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true
